<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Trocar senha · {{ app_nome }}</title>
<style>
:root{--roxo:#6b3fe0;--roxo-esc:#5630b8;--tinta:#1d1a2b;--mudo:#6e6a80;--linha:#e6e3f0;--fundo:#f7f6fb;--erro:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--fundo);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:380px;background:#fff;border:1px solid var(--linha);border-radius:20px;padding:32px 28px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--mudo);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;font:inherit;background:#fff;color:var(--tinta)}
input:focus-visible,button:focus-visible{outline:3px solid #cfc2f7;outline-offset:1px;border-color:var(--roxo)}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:var(--roxo);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--roxo-esc)}
.erro{background:#fdecea;color:var(--erro);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:8px}
small{display:block;margin-top:6px;color:var(--mudo);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Defina sua senha</h1>
  <p>{% if usuario and usuario.trocar_senha %}Sua senha atual é provisória. Escolha uma nova para continuar.{% else %}Informe a senha atual e escolha uma nova.{% endif %}</p>
  {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
  <form method="post" action="/conta/senha">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="atual">Senha atual</label>
    <input id="atual" name="atual" type="password" autocomplete="current-password" required autofocus>
    <label for="nova">Nova senha</label>
    <input id="nova" name="nova" type="password" autocomplete="new-password" minlength="8" required>
    <small>Mínimo de 8 caracteres.</small>
    <button type="submit">Salvar senha</button>
  </form>
</main>
</body>
</html>
