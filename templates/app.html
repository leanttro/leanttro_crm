<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>{{ app_nome }}</title>
<style>
:root{--roxo:#6b3fe0;--roxo-esc:#5630b8;--roxo-claro:#efeafc;--tinta:#1d1a2b;--mudo:#6e6a80;--linha:#e6e3f0;--fundo:#f7f6fb;--card:#fff;--ok:#1e8e5a;--aviso:#b7791f;--erro:#c0392b;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #cfc2f7;outline-offset:1px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* navegação: barra lateral no desktop, menu inferior no celular */
nav{position:fixed;z-index:5;background:#fff;border:0 solid var(--linha);display:flex}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mudo);text-decoration:none;font-size:11px;font-weight:600;padding:8px 4px;border-radius:12px}
nav a.on{color:var(--roxo);background:var(--roxo-claro)}
.logo{width:34px;height:34px;border-radius:10px;background:var(--roxo)}
@media(min-width:800px){
  nav{top:0;left:0;bottom:0;width:76px;flex-direction:column;align-items:stretch;gap:6px;padding:16px 8px;border-right-width:1px}
  .logo{margin:0 auto 14px}
  main{margin-left:76px}
}
@media(max-width:799px){
  nav{left:0;right:0;bottom:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top-width:1px}
  nav a{flex:1}.logo{display:none}
  main{padding-bottom:84px}
}
main{max-width:980px;padding:24px 18px}
@media(min-width:800px){main{padding:32px 36px;margin-right:auto}}
h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mudo);margin:0 0 22px}
.grid{display:grid;gap:14px}
@media(min-width:800px){.grid.dois{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:18px}
.vazio{color:var(--mudo);font-size:14px;padding:6px 0}
.linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linha)}
.linha:first-of-type{border-top:0}
.linha small{display:block;color:var(--mudo)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--roxo-claro);color:var(--roxo-esc);white-space:nowrap}
.chip.ok{background:#e4f5ec;color:var(--ok)}.chip.av{background:#fbf1de;color:var(--aviso)}.chip.er{background:#fdecea;color:var(--erro)}
.num{font-size:22px;font-weight:700;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis div small{display:block;color:var(--mudo);font-size:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--roxo);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--roxo-esc)}
.btn.sec{background:var(--roxo-claro);color:var(--roxo-esc)}
.btn.peq{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.atalhos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:var(--mudo)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff}
.form{display:grid;gap:0 12px}
@media(min-width:600px){.form{grid-template-columns:1fr 1fr}}
.funil{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.col{flex:0 0 240px;scroll-snap-align:start;background:#fff;border:1px solid var(--linha);border-radius:var(--r);padding:12px}
.col h3{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between}
.col .lead{padding:8px 10px;border-radius:10px;background:var(--fundo);margin-bottom:6px;font-size:14px}
.col .lead small{display:block;color:var(--mudo)}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--mudo)}
.seg button.on{background:var(--roxo-claro);color:var(--roxo-esc)}
details{border-top:1px solid var(--linha);padding:10px 0}
summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
.aviso{background:var(--roxo-claro);border-radius:12px;padding:12px 14px;margin-bottom:14px;word-break:break-all}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}

.col .lead{display:block;width:100%;text-align:left;border:0;cursor:pointer}
.col .lead:hover{background:var(--roxo-claro)}
textarea{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;background:#fff;font:inherit;min-height:84px;resize:vertical}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn.perigo{background:#fdecea;color:var(--erro)}
.clic{width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sep{border-top:1px solid var(--linha);margin:18px 0 6px;padding-top:14px}
.sep h3{font-size:14px;margin:0 0 6px}
dialog{border:1px solid var(--linha);border-radius:20px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);color:var(--tinta);background:#fff}
dialog::backdrop{background:rgba(29,26,43,.45)}
.dlg-in{padding:22px 22px 24px}
.dlg-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.dlg-topo h2{font-size:19px;margin:0}
.x{border:0;background:var(--fundo);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.hist{font-size:13px;color:var(--mudo);padding:6px 0;border-top:1px solid var(--linha)}
.hist b{color:var(--tinta);font-weight:600}
.mes{max-width:180px}
@media(prefers-reduced-motion:reduce){ #toast{transition:none}}


/* ===== LEANTTRO / camada visual da identidade ===== */
:root{
  --roxo:#7138E8;--roxo-esc:#5425C5;--roxo-claro:#F3EDFF;
  --tinta:#171127;--mudo:#706B80;--linha:#E8E1F2;--fundo:#FAF9FC;
  --card:#FFFFFF;--r:18px;
}
html{scroll-behavior:smooth}
body{background:var(--fundo);color:var(--tinta);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.012em}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid rgba(113,56,232,.28);outline-offset:2px}
nav{background:#fff;border-color:var(--linha);box-shadow:8px 0 32px rgba(35,18,65,.035)}
.logo-link{display:flex;align-items:center;justify-content:center;padding:10px 8px 22px;margin:0 0 12px;border-radius:0!important;background:transparent!important}
.logo{display:block;width:158px;height:auto;max-width:100%;object-fit:contain;border-radius:0;background:transparent}
nav a{color:#777184;font-size:13px;font-weight:600;letter-spacing:0;transition:background .18s ease,color .18s ease}
nav a:hover{color:var(--roxo);background:#F8F5FF}
nav a.on{color:var(--roxo);background:var(--roxo-claro);position:relative}
nav a.on:before{content:"";position:absolute;background:var(--roxo);border-radius:0 5px 5px 0}
.marca-mobile{display:none}
@media(min-width:800px){
  nav{top:0;left:0;bottom:0;width:232px;flex-direction:column;align-items:stretch;gap:5px;padding:24px 16px;border-right-width:1px}
  .logo-link{justify-content:flex-start;padding:6px 8px 24px;margin:0 0 10px}
  .logo{width:164px}
  nav a:not(.logo-link){flex-direction:row;justify-content:flex-start;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;font-size:13px}
  nav a.on:before{left:-16px;top:9px;bottom:9px;width:3px}
  main{margin-left:232px;max-width:1320px}
  main{padding:42px 48px}
}
@media(max-width:799px){
  .marca-mobile{height:64px;display:flex;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--linha)}
  .marca-mobile a{display:inline-flex;align-items:center}
  .marca-mobile img{display:block;width:142px;height:auto;max-height:38px;object-fit:contain}
  nav{left:0;right:0;bottom:0;justify-content:space-around;gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom,0px));border-top-width:1px;box-shadow:0 -8px 28px rgba(35,18,65,.07)}
  .logo-link{display:none}
  nav a{flex:1;min-width:0;padding:7px 2px;border-radius:11px;font-size:10px;gap:4px}
  nav a.on:before{display:none}
  main{padding:22px 15px 92px}
}
h1{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.045em;line-height:1.15;margin:0 0 7px;color:var(--tinta)}
h2{font-size:16px;font-weight:750;letter-spacing:-.025em;color:var(--tinta)}
.sub{color:var(--mudo);font-size:14px;line-height:1.6;margin:0 0 24px}
.grid{gap:16px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:20px;box-shadow:0 5px 18px rgba(35,18,65,.025)}
.linha{border-top-color:#F0ECF5;padding:12px 0}
.linha small,.col .lead small{color:#858092}
.chip{background:#F0E9FF;color:#5B2BCB;font-weight:700;padding:4px 10px}
.chip.ok{background:#E7F6EE;color:#18794E}.chip.av{background:#FFF4DE;color:#94600C}.chip.er{background:#FDEBEA;color:#B42318}
.num{font-size:clamp(18px,2vw,23px);font-weight:800;letter-spacing:-.045em;color:var(--tinta);font-variant-numeric:tabular-nums}
.kpis{gap:14px}
.kpis div{min-width:0}
.kpis div small{font-size:11px;font-weight:650;color:var(--mudo);margin-bottom:3px}
.btn{background:var(--roxo);border-radius:11px;padding:10px 16px;font-weight:700;box-shadow:0 4px 10px rgba(113,56,232,.13);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}
.btn:hover{background:var(--roxo-esc);box-shadow:0 6px 15px rgba(113,56,232,.2);transform:translateY(-1px)}
.btn.sec{background:#F1EBFF;color:#582CC5;box-shadow:none}
.btn.sec:hover{background:#E8DCFF}
.btn.peq{box-shadow:none}
.btn.perigo{background:#FDEBEA;color:#B42318;box-shadow:none}
input,select,textarea{border:1px solid #E3DDED;border-radius:11px;background:#fff;transition:border-color .16s ease,box-shadow .16s ease}
input:focus,select:focus,textarea:focus{outline:0;border-color:#A987F5;box-shadow:0 0 0 3px rgba(113,56,232,.1)}
label{font-size:12px;font-weight:700;color:#625C70;margin:12px 0 6px}
.col{background:#F7F4FC;border:1px solid #EAE3F3;border-radius:16px;padding:13px}
.col h3{font-size:12px;font-weight:750;color:#5D566B}
.col .lead{background:#fff;border:1px solid #EEE9F4;border-radius:11px;padding:11px;margin-bottom:8px;line-height:1.4}
.col .lead:hover{background:#F5F0FF;border-color:#DCCBFF}
.seg{border-color:#E7E0EF;border-radius:11px;padding:3px}
.seg button{border-radius:8px;font-size:12px}
.seg button.on{background:var(--roxo-claro);color:#582CC5}
.aviso{background:#F3EDFF;border:1px solid #E5D9FF;color:#49328A;border-radius:13px}
#toast{background:#211735;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(20,10,35,.2)}
dialog{border:1px solid var(--linha);border-radius:20px;box-shadow:0 24px 80px rgba(25,13,45,.2)}
dialog::backdrop{background:rgba(25,13,45,.48);backdrop-filter:blur(3px)}
.dlg-in{padding:24px}
.dlg-topo h2{font-size:20px;font-weight:800}
.x{background:#F3EFF8;color:#5E566C}
details{border-top-color:#EEE9F4}
.funil{padding:2px 2px 12px}
.atalhos{gap:9px;margin-bottom:20px}
@media(max-width:520px){
  .card{padding:16px;border-radius:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .num{font-size:19px}
  .btn{padding:10px 13px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol>
  <symbol id="i-prospeccao" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-vendas" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="i-operacao" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/></symbol>
  <symbol id="i-financeiro" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></symbol>
  <symbol id="i-perfil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
</svg>

<header class="marca-mobile" aria-label="Leanttro">
  <a href="#inicio" aria-label="Ir para o início"><img src="https://res.cloudinary.com/dhu1cqvrb/image/upload/f_auto,q_auto,h_80/v1779207400/leanttro_bohuce.png" alt="Leanttro"></a>
</header>
<nav id="menu" aria-label="Principal"></nav>
<main id="view" aria-live="polite"></main>
<dialog id="dlg" aria-labelledby="dlg-titulo"></dialog>
<div id="toast" role="status"></div>

<script>
const EU = {{ {'id': usuario.id, 'nome': usuario.nome, 'admin': usuario.is_admin}|tojson }};
const CSRF = {{ csrf|tojson }};
const PAGINAS = [['inicio','Início'],['prospeccao','Prospecção'],['vendas','Vendas'],['operacao','Operação']]
  .concat(EU.admin ? [['financeiro','Financeiro']] : [])
  .concat([['perfil', EU.admin ? 'Gestão' : 'Perfil']]);
const STATUS = {novo:'Novo',em_contato:'Em contato',qualificado:'Qualificado',proposta_enviada:'Proposta enviada',negociacao:'Negociação',fechado:'Fechado',perdido:'Perdido'};
const COM_STATUS = {aguardando:['Aguardando','av'],liberada:['Liberada','ok'],parcial:['Parcial',''],paga:['Paga','ok']};
let equipe = false;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reais = c => ((c || 0) / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => (v === '' || v == null) ? null : Number(String(v).replace(',', '.'));

async function api(metodo, url, corpo) {
  const r = await fetch(url, {method:metodo, headers:{'Content-Type':'application/json','X-CSRF':CSRF}, body: corpo ? JSON.stringify(corpo) : undefined});
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = '/login'; throw new Error('Faça login.'); }
  if (!r.ok || d.ok === false) throw new Error(d.erro || 'Erro ' + r.status);
  return d;
}
let _t;
function aviso(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(_t); _t = setTimeout(() => t.classList.remove('on'), 3200);
}


/* dinheiro: "1.500,50" -> 150050 (inteiro, como o backend exige) */
const cent = v => {
  v = String(v ?? '').replace(/[R$\s]/g, '');
  if (!v) return null;
  if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(v);
  return isNaN(n) || n < 0 ? null : Math.round(n * 100);
};
const val = id => ($('#' + id)?.value ?? '').trim();
const dataBR = s => s ? new Date(s.length > 10 ? s : s + 'T12:00:00').toLocaleDateString('pt-BR') : '—';
const campo = (id, rotulo, valor, extra = '') => `<div><label for="${id}">${rotulo}</label><input id="${id}" value="${esc(valor)}" ${extra}></div>`;
const opcoes = (lista, atual) => lista.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(atual ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');

let _srv = null;
async function servicos() { if (!_srv) _srv = (await api('GET', '/api/servicos')).servicos.filter(s => s.ativo); return _srv; }
const opcoesSrv = (srv, atual) => '<option value="">Sem serviço</option>' + srv.map(s => `<option value="${s.id}" ${String(s.id) === String(atual ?? '') ? 'selected' : ''}>${esc(s.nome)}</option>`).join('');

/* janela (dialog) */
function abrir(titulo, html, ctx = {}) {
  const d = $('#dlg');
  Object.keys(d.dataset).forEach(k => delete d.dataset[k]);
  Object.assign(d.dataset, ctx);
  d.innerHTML = `<div class="dlg-in"><div class="dlg-topo"><h2 id="dlg-titulo">${esc(titulo)}</h2>
    <button class="x" data-act="fechar" aria-label="Fechar">×</button></div>${html}</div>`;
  if (!d.open) d.showModal();
}
function fechar() { const d = $('#dlg'); if (d.open) d.close(); }
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) fechar(); });

/* ---------- peças ---------- */
const chipLead = s => `<span class="chip ${s==='fechado'?'ok':s==='perdido'?'er':''}">${esc(STATUS[s]||s)}</span>`;
const chipCom = s => { const [t, c] = COM_STATUS[s] || [s, '']; return `<span class="chip ${c}">${t}</span>`; };
const PROJ = {a_iniciar:['A iniciar','av'], andamento:['Em andamento',''], entregue:['Entregue','ok']};
const chipProj = s => `<span class="chip ${(PROJ[s] || [0, ''])[1]}">${(PROJ[s] || [s])[0]}</span>`;
const PAG = {pago:'ok', parcial:'av', pendente:'', atrasado:'er'};
const chipPag = s => `<span class="chip ${PAG[s] ?? ''}">${esc(s)}</span>`;
const vazio = t => `<p class="vazio">${t}</p>`;
const seletorEquipe = () => EU.admin ? `<div class="seg" role="group" aria-label="Escopo">
  <button data-act="escopo" data-v="0" class="${equipe?'':'on'}">Meus</button>
  <button data-act="escopo" data-v="1" class="${equipe?'on':''}">Equipe</button></div>` : '';

function totaisCom(t) {
  return `<div class="kpis">
    <div><small>Previsto</small><span class="num">${reais(t.previsto_cent)}</span></div>
    <div><small>A pagar agora</small><span class="num">${reais(t.a_pagar_cent)}</span></div>
    <div><small>Já pago</small><span class="num">${reais(t.pago_cent)}</span></div></div>`;
}

/* ---------- páginas ---------- */
const VIEWS = {
  async inicio(el) {
    const [l, c] = await Promise.all([api('GET', '/api/leads'), api('GET', '/api/comissoes')]);
    const ativos = l.leads.filter(x => !['fechado', 'perdido'].includes(x.status));
    const hora = new Date().getHours();
    el.innerHTML = `<h1>${hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite'}, ${esc(EU.nome.split(' ')[0])}</h1>
      <p class="sub">${ativos.length ? `Você tem ${ativos.length} lead${ativos.length>1?'s':''} em andamento.` : 'Nenhum lead em andamento no momento.'}</p>
      <div class="atalhos">
        <a class="btn" href="#prospeccao">Buscar empresas</a>
        <a class="btn sec" href="#vendas">Ver funil</a>
        <a class="btn sec" href="#operacao">Clientes</a></div>
      <div class="grid dois">
        <section class="card"><h2>Leads em andamento</h2>
          ${ativos.slice(0, 8).map(x => `<div class="linha"><div>${esc(x.empresa)}<small>${esc(x.contato || 'Sem contato')} · ${reais(x.valor_estimado_cent)}</small></div>${chipLead(x.status)}</div>`).join('') || vazio('Quando você cadastrar ou importar leads, eles aparecem aqui.')}
        </section>
        <section class="card"><h2>Minhas comissões</h2>${totaisCom(c.totais)}
          ${c.comissoes.length ? '' : vazio('As comissões aparecem quando uma venda é fechada.')}
        </section></div>`;
  },

  async prospeccao(el) {
    const [me, bs] = await Promise.all([api('GET', '/api/me'), api('GET', '/api/prospeccao')]);
    el.innerHTML = `<h1>Prospecção</h1>
      <p class="sub">Encontre empresas por segmento e cidade. Os resultados são potenciais, não contatos validados.</p>
      <section class="card">
        <div class="form">

/* ---------- prospecção: resultados ---------- */
let buscaAtual = null;
function pintarBusca(id, titulo, rs) {
  buscaAtual = id;
  const box = $('#res'); box.hidden = false;
  box.innerHTML = `<h2>${esc(titulo)}</h2>` + (rs.map(r => `<div class="linha"><div>${esc(r.titulo)}
      <small>${esc([r.telefone, r.site, r.endereco].filter(Boolean).join(' · ') || 'Sem dados de contato')}</small></div>
      <div>${r.status === 'novo' ? `<button class="btn peq" data-act="importar" data-id="${r.id}">Virar lead</button>
          <button class="btn peq sec" data-act="descartar" data-id="${r.id}">Descartar</button>`
        : `<span class="chip ${r.status === 'importado' ? 'ok' : ''}">${r.status === 'importado' ? 'Lead criado' : 'Descartado'}</span>`}</div></div>`).join('')
    || vazio('Nenhum resultado para essa busca.'));
  box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
async function recarregarBusca() {
  if (!buscaAtual) return;
  const r = await api('GET', '/api/prospeccao/' + buscaAtual);
  pintarBusca(r.busca.id, r.busca.consulta + (r.busca.cidade ? ' · ' + r.busca.cidade : ''), r.resultados);
}

  if (!p) return aviso('Projeto não encontrado.');
  abrir(p.nome, `
    <p class="sub" style="margin-bottom:6px">${esc(p.cliente)} · ${p.horas}h lançadas${EU.admin || true ? ' · mão de obra ' + reais(p.custo_mao_obra_cent) : ''}</p>
    <div class="form">${campo('p-nome', 'Nome', p.nome)}
      <div><label for="p-status">Status</label><select id="p-status">${opcoes([['a_iniciar', 'A iniciar'], ['andamento', 'Em andamento'], ['entregue', 'Entregue']], p.status)}</select></div>
      <div><label for="p-prazo">Prazo</label><input id="p-prazo" type="date" value="${esc(p.prazo ? p.prazo.slice(0, 10) : '')}"></div>
      ${campo('p-custo', 'Custo da hora (R$)', ((p.custo_hora_cent || 0) / 100).toFixed(2).replace('.', ','), 'inputmode="decimal"')}
      ${campo('p-obs', 'Observações', p.observacoes)}</div>
    <div class="acoes"><button class="btn" data-act="salvar-projeto">Salvar</button></div>
    <div class="sep"><h3>Lançar horas</h3>
      <div class="form">${campo('h-horas', 'Horas', '', 'inputmode="decimal" placeholder="2,5"')}
        <div><label for="h-data">Data</label><input id="h-data" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>${campo('h-desc', 'O que foi feito', '')}</div>
      <p style="margin:10px 0 0"><button class="btn peq sec" data-act="lancar-horas">Lançar</button></p></div>`, {id: p.id});
}

/* ---------- ações ---------- */
const ACOES = {

  /* --- prospecção --- */
  async buscar() {
    const consulta = val('q'); if (!consulta) return aviso('Informe o segmento.');
    const r = await api('POST', '/api/prospeccao', {consulta, cidade: val('cid')});
    pintarBusca(r.busca_id, consulta + (val('cid') ? ' · ' + val('cid') : ''), r.resultados);
  },
  async 'abrir-busca'(b) { const r = await api('GET', '/api/prospeccao/' + b.dataset.id); pintarBusca(r.busca.id, r.busca.consulta + (r.busca.cidade ? ' · ' + r.busca.cidade : ''), r.resultados); },
  async importar(b) { await api('POST', `/api/prospeccao/resultados/${b.dataset.id}/importar`, {}); aviso('Lead criado. Veja em Vendas.'); return recarregarBusca(); },
  async descartar(b) { await api('POST', `/api/prospeccao/resultados/${b.dataset.id}/descartar`, {}); return recarregarBusca(); },

  /* --- leads --- */
  fechar: () => fechar(),
  'novo-lead'() {
    abrir('Novo lead', `<div class="form">${campo('l-empresa', 'Empresa', '')}${campo('l-contato', 'Contato', '')}${campo('l-telefone', 'Telefone', '')}
      ${campo('l-whatsapp', 'WhatsApp', '')}${campo('l-email', 'E-mail', '', 'type="email"')}${campo('l-site', 'Site', '')}
      ${campo('l-segmento', 'Segmento', '')}${campo('l-cidade', 'Cidade', '')}${campo('l-valor', 'Valor estimado (R$)', '', 'inputmode="decimal"')}</div>
      <div class="acoes"><button class="btn" data-act="criar-lead">Criar lead</button></div>`);
  },
  async 'criar-lead'() {
    await api('POST', '/api/leads', {origem: 'manual', empresa: val('l-empresa'), contato: val('l-contato'), telefone: val('l-telefone'), whatsapp: val('l-whatsapp'),
      email: val('l-email'), site: val('l-site'), segmento: val('l-segmento'), cidade: val('l-cidade'), valor_estimado_cent: cent(val('l-valor')) || 0});
    fechar(); aviso('Lead criado.'); return rota();
  },
  async lead(b) { return abrirLead(b.dataset.id); },
  async 'salvar-lead'() {
    const id = $('#dlg').dataset.id, d = {empresa: val('l-empresa'), contato: val('l-contato'), telefone: val('l-telefone'), whatsapp: val('l-whatsapp'),
      email: val('l-email'), site: val('l-site'), segmento: val('l-segmento'), cidade: val('l-cidade'),
      valor_estimado_cent: cent(val('l-valor')) || 0, servico_id: val('l-srv') ? Number(val('l-srv')) : null, versao: Number($('#dlg').dataset.versao)};
    if (!$('#l-status').disabled && val('l-status') !== $('#dlg').dataset.status) { d.status = val('l-status'); d.motivo_perda = val('l-motivo'); }
    await api('PUT', '/api/leads/' + id, d); aviso('Lead salvo.'); await rota(); return abrirLead(id);
  },
  async 'nota-lead'() {
    const t = val('l-nota'); if (!t) return aviso('Escreva a nota.');
    await api('POST', `/api/leads/${$('#dlg').dataset.id}/nota`, {texto: t, tipo: $('#l-nota-tipo').value}); return abrirLead($('#dlg').dataset.id);
  },
  async 'ia-msg'() {
    const r = await api('POST', '/api/ia/mensagem', {lead_id: Number($('#dlg').dataset.id), canal: val('l-canal')});
    $('#l-ia').value = r.texto; $('#l-ia-box').hidden = false;
  },
  async 'copiar-ia'() { await navigator.clipboard.writeText($('#l-ia').value); aviso('Mensagem copiada.'); },
  async 'gerar-proposta'() {
    const d = {lead_id: Number($('#dlg').dataset.id)}, s = cent(val('pr-setup')), m = cent(val('pr-mensal'));
    if (val('l-srv')) d.servico_id = Number(val('l-srv'));
    if (s !== null) d.setup_cent = s; if (m !== null) d.mensal_cent = m;
    if (val('pr-validade')) d.validade = val('pr-validade');
    if (val('pr-cond')) d.condicoes = val('pr-cond');
    await api('POST', '/api/propostas', d); aviso('Proposta gerada.'); await rota(); return abrirLead(d.lead_id);
  },
  async 'status-proposta'(b) { await api('PUT', '/api/propostas/' + b.dataset.id, {status: b.dataset.st}); return abrirLead($('#dlg').dataset.id); },
  async 'fechar-venda'() {
    const s = cent(val('fv-setup')) || 0, m = cent(val('fv-mensal')) || 0;
    if (s + m <= 0) return aviso('Informe o setup e/ou a mensalidade.');
    const d = {setup_cent: s, mensal_cent: m};
    if (val('l-srv')) d.servico_id = Number(val('l-srv'));
    if (val('fv-prop')) d.proposta_id = Number(val('fv-prop'));
    if (val('fv-setup-vence')) d.setup_vence = val('fv-setup-vence');
    if (val('fv-mensal-inicio')) d.mensal_inicio = val('fv-mensal-inicio');
    const r = await api('POST', `/api/leads/${$('#dlg').dataset.id}/fechar`, d);
    fechar(); aviso('Venda fechada! Cliente e projeto criados.'); location.hash = '#operacao'; return rota();
  },

  /* --- clientes e projetos --- */
  'novo-cliente'() {
    abrir('Novo cliente', `<div class="form">${campo('c-empresa', 'Empresa', '')}${campo('c-contato', 'Contato', '')}${campo('c-telefone', 'Telefone', '')}
      ${campo('c-email', 'E-mail', '', 'type="email"')}${campo('c-site', 'Site', '')}${campo('c-doc', 'CNPJ/CPF', '')}</div>
      <div class="acoes"><button class="btn" data-act="criar-cliente">Criar cliente</button></div>`);
  },
  async 'criar-cliente'() {
    await api('POST', '/api/clientes', {empresa: val('c-empresa'), contato: val('c-contato'), telefone: val('c-telefone'), email: val('c-email'), site: val('c-site'), documento: val('c-doc')});
    fechar(); aviso('Cliente criado.'); return rota();
  },
  async cliente(b) { return abrirCliente(b.dataset.id); },
  async 'salvar-cliente'() {
    const id = $('#dlg').dataset.id;
    await api('PUT', '/api/clientes/' + id, {empresa: val('c-empresa'), contato: val('c-contato'), telefone: val('c-telefone'), email: val('c-email'),
      site: val('c-site'), documento: val('c-doc'), endereco: val('c-end'), observacoes: val('c-obs')});
    aviso('Cliente salvo.'); await rota(); return abrirCliente(id);
  },
  async 'registrar-venda'() {
    const s = cent(val('v-setup')) || 0, m = cent(val('v-mensal')) || 0;
    if (s + m <= 0) return aviso('Informe o setup e/ou a mensalidade.');
    const d = {setup_cent: s, mensal_cent: m};
    if (val('v-srv')) d.servico_id = Number(val('v-srv'));
    if (val('v-setup-vence')) d.setup_vence = val('v-setup-vence');
    if (val('v-mensal-inicio')) d.mensal_inicio = val('v-mensal-inicio');
    const id = $('#dlg').dataset.id;
    await api('POST', `/api/clientes/${id}/venda`, d); aviso('Venda registrada.'); await rota(); return abrirCliente(id);
  },
  async 'cancelar-mensal'(b) {
    if (!confirm('Cancelar a mensalidade desta venda? As parcelas futuras serão removidas.')) return;
    const r = await api('POST', `/api/admin/vendas/${b.dataset.id}/cancelar-mensal`, {});
    aviso(r.mensalidades_removidas + ' parcela(s) removida(s).'); return abrirCliente($('#dlg').dataset.id);
  },
  async projeto(b) { return abrirProjeto(b.dataset.id); },
  async 'salvar-projeto'() {
    const id = $('#dlg').dataset.id;
    await api('PUT', '/api/projetos/' + id, {nome: val('p-nome'), status: val('p-status'), prazo: val('p-prazo') || null,
      custo_hora_cent: cent(val('p-custo')) || 0, observacoes: val('p-obs')});
    aviso('Projeto salvo.'); await rota(); return abrirProjeto(id);
  },
  async 'lancar-horas'() {
    const h = Number(val('h-horas').replace(',', '.'));
    if (!(h > 0 && h <= 24)) return aviso('Horas deve ser entre 0 e 24.');
    const id = $('#dlg').dataset.id;
    await api('POST', `/api/projetos/${id}/horas`, {horas: h, data: val('h-data') || undefined, descricao: val('h-desc')});
    aviso('Horas lançadas.'); await rota(); return abrirProjeto(id);
  },

  /* --- financeiro --- */
  receber(b) {
    abrir('Receber pagamento', `<div class="form">${campo('r-valor', 'Valor recebido (R$)', (b.dataset.resta / 100).toFixed(2).replace('.', ','), 'inputmode="decimal"')}
      <div><label for="r-data">Data</label><input id="r-data" type="date" value="${new Date().toISOString().slice(0, 10)}"></div></div>
      <div class="acoes"><button class="btn" data-act="confirmar-receber" data-id="${b.dataset.id}">Confirmar</button></div>`);
  },
  async 'confirmar-receber'(b) {
    const v = cent(val('r-valor')); if (!v) return aviso('Informe o valor.');
    await api('POST', `/api/admin/pagamentos/${b.dataset.id}/receber`, {valor_recebido_cent: v, data: val('r-data') || undefined});
    fechar(); aviso('Pagamento registrado.'); return rota();
  },
  async 'add-custo'() {
    const v = cent(val('c-valor')); if (v === null) return aviso('Informe o valor.');
    await api('POST', '/api/admin/custos', {tipo: val('c-tipo'), recorrencia: val('c-rec'), categoria: val('c-cat'), descricao: val('c-desc'), valor_cent: v, data: val('c-data')});
    aviso('Custo lançado.'); return rota();
  },
  async 'del-custo'(b) { if (!confirm('Apagar este custo?')) return; await api('DELETE', '/api/admin/custos/' + b.dataset.id); return rota(); },
  escopo: b => { equipe = b.dataset.v === '1'; return rota(); },
  async 'salvar-cfg'() {
    await api('PUT', '/api/admin/config', {comissao_setup_pct: num($('#p-setup').value), comissao_mensal_pct: num($('#p-mensal').value)});
    aviso('Percentuais salvos.');
  },
  async pagar(b) { const r = await api('POST', `/api/admin/comissoes/${b.dataset.id}/pagar`, {}); aviso('Pago ' + reais(r.pago_agora_cent) + '.'); return rota(); },
  async 'salvar-chaves'() {
    const d = {};
    if ($('#k-groq').value.trim()) d.groq = $('#k-groq').value.trim();
    if ($('#k-serper').value.trim()) d.serper = $('#k-serper').value.trim();
    if (!Object.keys(d).length) return aviso('Digite uma chave para salvar.');
    await api('PUT', '/api/me/chaves', d); aviso('Chaves salvas.'); return rota();
  },
  async 'criar-user'() {
    const r = await api('POST', '/api/admin/usuarios', {nome: $('#n-nome').value, email: $('#n-email').value, papel: $('#n-papel').value,
      comissao_setup_pct: num($('#n-setup').value), comissao_mensal_pct: num($('#n-mensal').value)});
    await rota(); mostrarSenha(r.usuario.email, r.senha_temporaria);
  },
  async 'salvar-user'(b) {
    const box = b.closest('details'), d = {};
    box.querySelectorAll('[data-f]').forEach(i => {
      const f = i.dataset.f;
      if (f.startsWith('comissao')) d[f] = num(i.value);
      else if (i.value.trim()) d[f] = i.value.trim();
    });
    await api('PUT', '/api/admin/usuarios/' + box.dataset.uid, d); aviso('Usuário salvo.'); return rota();
  },
  async 'reset-senha'(b) {
    const id = b.closest('details').dataset.uid;
    const r = await api('PUT', '/api/admin/usuarios/' + id, {resetar_senha: true});
    await rota(); mostrarSenha(r.usuario.email, r.senha_temporaria);
  },
  async alternar(b) { await api('PUT', '/api/admin/usuarios/' + b.closest('details').dataset.uid, {status: b.dataset.st}); aviso('Acesso atualizado.'); return rota(); }
};

function mostrarSenha(email, senha) {
  const el = $('#banner'); if (!el) return;
  el.innerHTML = `<div class="aviso"><strong>Senha provisória de ${esc(email)}:</strong> <code>${esc(senha)}</code><br>
    Ela aparece só agora. A pessoa troca no primeiro acesso.</div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || !ACOES[b.dataset.act]) return;
  b.disabled = true;
  try { await ACOES[b.dataset.act](b); } catch (err) { aviso(err.message); }
  b.disabled = false;
});

/* ---------- rota ---------- */
function desenharMenu() {
  const atual = (location.hash || '#inicio').slice(1);
  $('#menu').innerHTML = '<a class="logo-link" href="#inicio" aria-label="Leanttro — Início"><img class="logo" src="https://res.cloudinary.com/dhu1cqvrb/image/upload/f_auto,q_auto,h_80/v1779207400/leanttro_bohuce.png" alt="Leanttro"></a>' + PAGINAS.map(([id, nome]) =>
    `<a href="#${id}" class="${id === atual ? 'on' : ''}" ${id === atual ? 'aria-current="page"' : ''}><svg><use href="#i-${id}"/></svg>${nome}</a>`).join('');
}
async function rota() {
  let id = (location.hash || '#inicio').slice(1);
  if (!VIEWS[id] || !PAGINAS.some(p => p[0] === id)) id = 'inicio';
  desenharMenu();
  const el = $('#view');
  try { await VIEWS[id](el); }
  catch (err) { el.innerHTML = `<section class="card"><h2>Não foi possível carregar</h2><p class="vazio">${esc(err.message)}</p><button class="btn" data-act="escopo" data-v="${equipe?1:0}">Tentar de novo</button></section>`; }
}
addEventListener('hashchange', () => { fechar(); rota(); window.scrollTo(0, 0); });
rota();
</script>
</body>
