<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#7943e2">
<title>{{ app_nome }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--roxo:#7943e2;--roxo-esc:#6532cf;--tinta:#071421;--escuro:#120b24;--roxo-claro:#ece5fd;--lavanda:#f4effd;--linha:#dfe6e9;--mudo:#425064;--fundo:#f8f6fd;--card:#fff;--lima:#D7F43A;--ok:#1e8e5a;--aviso:#b7791f;--erro:#c0392b;--r:13px;--sombra:0 5px 15px #0a1a2510}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(110deg,var(--lavanda),var(--fundo)) fixed;color:#07111b;font:14px/1.5 "DM Sans",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #cdb8ff;outline-offset:1px}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* cabeçalho igual ao do site: roxo, logo à esquerda, menu à direita (hambúrguer no celular) */
.topbar{position:sticky;top:0;z-index:10;background:var(--roxo);color:#fff;box-shadow:0 2px 14px #0002;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(0px + env(safe-area-inset-top,0px)) 40px 0;min-height:76px;font-family:"DM Sans",Arial,sans-serif}
.topbar>a{display:block}
.logo{height:36px;width:auto;display:block;filter:brightness(0) invert(1)}
.logo[hidden],.logo-txt[hidden]{display:none}
.logo-txt{font:italic 900 27px/1 "DM Sans",Arial,sans-serif;letter-spacing:-1.5px;color:#fff;display:block}
.burger{display:none;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:10px;background:#ffffff24;color:#fff;cursor:pointer}
.burger svg{width:22px;height:22px}
nav{display:flex;align-items:center;gap:6px}
nav a{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:9px 16px;border-radius:22px}
nav a svg{display:none}
nav a:hover{background:#ffffff1f;color:#e7dcff}
nav a.on{background:var(--tinta);color:#fff}
nav a.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lima)}
@media(max-width:799px){
  .topbar{padding:env(safe-area-inset-top,0px) 18px 0;min-height:64px}
  .logo{height:30px}
  .burger{display:inline-flex}
  nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:4px;padding:12px 14px 18px;background:var(--escuro);border-radius:0 0 20px 20px;box-shadow:0 24px 40px -20px #000a}
  nav.aberto{display:flex}
  nav a{padding:13px 16px;border-radius:12px;font-size:15px;color:#e4dafb}
  nav a svg{display:block}
  nav a.on{background:var(--roxo);color:#fff}
}
main{max-width:1120px;margin:0 auto;padding:28px 18px 40px}
@media(min-width:800px){main{padding:40px 24px 56px}}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;margin:0 0 6px;letter-spacing:-1.4px;line-height:1.05;color:var(--tinta)}
h2{font-size:16px;font-weight:800;margin:0 0 12px;letter-spacing:-.3px;color:var(--tinta)}
.sub{color:var(--mudo);font-size:15px;line-height:1.5;margin:0 0 26px;max-width:640px}
.grid{display:grid;gap:16px}
@media(min-width:800px){.grid.dois{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:22px;box-shadow:var(--sombra)}
.vazio{color:var(--mudo);font-size:13px;padding:6px 0}
.linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha);font-weight:600}
.linha:first-of-type{border-top:0}
.linha small{display:block;color:var(--mudo);font-size:12px;font-weight:500}
.chip{display:inline-block;padding:5px 11px;border-radius:30px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;background:var(--roxo-claro);color:var(--roxo-esc);white-space:nowrap}
.chip.ok{background:#e4f5ec;color:var(--ok)}.chip.av{background:#fbf1de;color:var(--aviso)}.chip.er{background:#fdecea;color:var(--erro)}
.num{font-size:24px;font-weight:800;letter-spacing:-1px;color:var(--roxo-esc);line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis div{background:var(--lavanda);border:1px solid #e3d9fa;border-radius:12px;padding:12px 14px}
.kpis div small{display:block;color:var(--mudo);font-size:11px;font-weight:700;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border:0;border-radius:10px;background:var(--roxo);color:#fff;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;box-shadow:0 8px 24px #7943e244;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.btn.sec{background:transparent;color:var(--roxo-esc);border:1px solid var(--roxo);box-shadow:none}
.btn.sec:hover{background:var(--roxo-claro);filter:none}
.btn.peq{padding:8px 14px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.atalhos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:var(--mudo)}
input,select{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;background:#fff}
input:focus-visible,select:focus-visible{outline:0;border-color:var(--roxo);box-shadow:0 0 0 4px #7943e226}
.form{display:grid;gap:0 12px}
@media(min-width:600px){.form{grid-template-columns:1fr 1fr}}
.funil{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.col{min-width:0;background:#fff;border:1px solid var(--linha);border-radius:var(--r);padding:14px;box-shadow:var(--sombra)}
.col h3{font-size:13px;font-weight:800;letter-spacing:-.2px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.col .lead{padding:10px 12px;border-radius:10px;background:var(--lavanda);border:1px solid #e3d9fa;margin-bottom:6px;font-size:13px;font-weight:700}
.col .lead small{display:block;color:var(--mudo);font-weight:500;font-size:12px}
.full{grid-column:1/-1}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.perigo{color:var(--erro);border-color:var(--erro)}
.btn.perigo:hover{background:#fdecea}
dialog{border:0;border-radius:16px;padding:0;width:min(580px,94vw);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px #000a;color:inherit;background:#fff}
dialog::backdrop{background:#120b2488}
.dlg{padding:22px}
.dlg h2{font-size:20px;margin-bottom:4px}
.dlg .rod{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg .aviso{margin:12px 0 0;word-break:normal}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:800;color:var(--mudo)}
.seg button.on{background:var(--roxo);color:#fff}
details{border-top:1px solid var(--linha);padding:12px 0}
summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none;font-weight:700}
summary::-webkit-details-marker{display:none}
.aviso{background:#f6f2ff;border:1px solid #e3d9fa;border-left:4px solid var(--roxo);border-radius:12px;padding:12px 14px;margin-bottom:14px;word-break:break-all;color:#0f0a1f}
.aviso code,.vazio code{background:#fff;border:1px solid var(--linha);border-radius:6px;padding:1px 6px;font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--escuro);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;box-shadow:0 14px 34px -14px #000a}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){ #toast,.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></symbol>
  <symbol id="i-prospeccao" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-vendas" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
  <symbol id="i-operacao" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/></symbol>
  <symbol id="i-financeiro" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></symbol>
  <symbol id="i-perfil" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
</svg>

<header class="topbar">
  <a href="#inicio" aria-label="Leanttro - início"><img class="logo" src="https://res.cloudinary.com/dhu1cqvrb/image/upload/f_auto,q_auto,h_80/v1779207400/leanttro_bohuce.png" alt="" width="150" height="36" crossorigin="anonymous" referrerpolicy="no-referrer" decoding="async" onerror="this.onerror=null;this.hidden=true;this.nextElementSibling.hidden=false"><span class="logo-txt" hidden>LEANTTRO.</span></a>
  <button class="burger" id="burger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <nav id="menu" aria-label="Principal"></nav>
</header>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>
<dialog id="dlg-venda" aria-labelledby="dlg-tit"></dialog>

<script>
const EU = {{ {'id': usuario.id, 'nome': usuario.nome, 'admin': usuario.is_admin}|tojson }};
const CSRF = {{ csrf|tojson }};
const PAGINAS = [['inicio','Início'],['prospeccao','Prospecção'],['vendas','Vendas'],['operacao','Operação']]
  .concat(EU.admin ? [['financeiro','Financeiro']] : [])
  .concat([['perfil', EU.admin ? 'Gestão' : 'Perfil']]);
const STATUS = {novo:'Novo',em_contato:'Em contato',qualificado:'Qualificado',proposta_enviada:'Proposta enviada',negociacao:'Negociação',fechado:'Fechado',perdido:'Perdido'};
const COM_STATUS = {aguardando:['Aguardando','av'],liberada:['Liberada','ok'],parcial:['Parcial',''],paga:['Paga','ok']};
let equipe = false;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reais = c => ((c || 0) / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => (v === '' || v == null) ? null : Number(String(v).replace(',', '.'));
const cent = v => {
  let t = String(v ?? '').replace(/[R$\s]/g, '');
  if (!t) return 0;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{3}(\.|$)/.test(t)) t = t.replace(/\./g, '');
  const n = Number(t);
  if (!isFinite(n) || n < 0) throw new Error('Valor inválido.');
  return Math.round(n * 100);
};
const emReais = c => c ? (c / 100).toFixed(2).replace('.', ',') : '';
const dataBR = iso => iso ? iso.split('-').reverse().join('/') : '—';
let VENDAS = [];

async function api(metodo, url, corpo) {
  const r = await fetch(url, {method:metodo, headers:{'Content-Type':'application/json','X-CSRF':CSRF}, body: corpo ? JSON.stringify(corpo) : undefined});
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { location.href = '/login'; throw new Error('Faça login.'); }
  if (!r.ok || d.ok === false) throw new Error(d.erro || 'Erro ' + r.status);
  return d;
}
let _t;
function aviso(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(_t); _t = setTimeout(() => t.classList.remove('on'), 3200);
}

/* ---------- peças ---------- */
const chipLead = s => `<span class="chip ${s==='fechado'?'ok':s==='perdido'?'er':''}">${esc(STATUS[s]||s)}</span>`;
const chipCom = s => { const [t, c] = COM_STATUS[s] || [s, '']; return `<span class="chip ${c}">${t}</span>`; };
const vazio = t => `<p class="vazio">${t}</p>`;
const seletorEquipe = () => EU.admin ? `<div class="seg" role="group" aria-label="Escopo">
  <button data-act="escopo" data-v="0" class="${equipe?'':'on'}">Meus</button>
  <button data-act="escopo" data-v="1" class="${equipe?'on':''}">Equipe</button></div>` : '';

function totaisCom(t) {
  return `<div class="kpis">
    <div><small>Previsto</small><span class="num">${reais(t.previsto_cent)}</span></div>
    <div><small>A pagar agora</small><span class="num">${reais(t.a_pagar_cent)}</span></div>
    <div><small>Já pago</small><span class="num">${reais(t.pago_cent)}</span></div></div>`;
}

/* ---------- páginas ---------- */
const VIEWS = {
  async inicio(el) {
    const [l, c] = await Promise.all([api('GET', '/api/leads'), api('GET', '/api/comissoes')]);
    const ativos = l.leads.filter(x => !['fechado', 'perdido'].includes(x.status));
    const hora = new Date().getHours();
    el.innerHTML = `<h1>${hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite'}, ${esc(EU.nome.split(' ')[0])}</h1>
      <p class="sub">${ativos.length ? `Você tem ${ativos.length} lead${ativos.length>1?'s':''} em andamento.` : 'Nenhum lead em andamento no momento.'}</p>
      <div class="atalhos">
        <a class="btn" href="#prospeccao">Buscar empresas</a>
        <a class="btn sec" href="#vendas">Ver funil</a>
        <a class="btn sec" href="#operacao">Clientes</a></div>
      <div class="grid dois">
        <section class="card"><h2>Leads em andamento</h2>
          ${ativos.slice(0, 8).map(x => `<div class="linha"><div>${esc(x.empresa)}<small>${esc(x.contato || 'Sem contato')} · ${reais(x.valor_estimado_cent)}</small></div>${chipLead(x.status)}</div>`).join('') || vazio('Quando você cadastrar ou importar leads, eles aparecem aqui.')}
        </section>
        <section class="card"><h2>Minhas comissões</h2>${totaisCom(c.totais)}
          ${c.comissoes.length ? '' : vazio('As comissões aparecem quando uma venda é fechada.')}
        </section></div>`;
  },

  async prospeccao(el) {
    const me = (await api('GET', '/api/me')).usuario;
    el.innerHTML = `<h1>Prospecção</h1>
      <p class="sub">Encontre empresas por segmento e cidade. Os resultados são potenciais, não contatos validados.</p>
      <section class="card">
        <div class="form">
          <div><label for="q">Segmento ou palavra-chave</label><input id="q" placeholder="Clínicas odontológicas"></div>
          <div><label for="cid">Cidade ou região</label><input id="cid" placeholder="São Paulo"></div></div>
        <p style="margin:14px 0 0"><button class="btn" disabled>Buscar</button></p>
        <p class="vazio">${me.serper ? 'Chave Serper cadastrada (' + esc(me.serper) + ').' : 'Você ainda não tem chave Serper. Cadastre em Perfil.'} A busca será ativada quando a rota <code>/api/prospeccao</code> existir no backend.</p>
      </section>`;
  },

  async vendas(el) {
    const q = equipe ? '?equipe=1' : '';
    const [l, c, vd] = await Promise.all([api('GET', '/api/leads' + q), api('GET', '/api/comissoes' + q), api('GET', '/api/vendas' + q)]);
    VENDAS = vd.vendas;
    const colunas = Object.keys(STATUS).map(s => {
      const itens = l.leads.filter(x => x.status === s);
      return `<div class="col"><h3><span>${STATUS[s]}</span><span class="chip">${itens.length}</span></h3>
        ${itens.map(x => `<div class="lead">${esc(x.empresa)}<small>${esc(x.contato || '—')} · ${reais(x.valor_estimado_cent)}</small></div>`).join('') || vazio('Vazio')}</div>`;
    }).join('');
    const linhas = VENDAS.map(v => `<div class="linha"><div>${esc(v.cliente)}
        <small>${equipe && v.vendedor ? esc(v.vendedor) + ' · ' : ''}Setup ${reais(v.setup_cent)} · Mensal ${reais(v.mensal_cent)} · ${dataBR(v.fechada_em)}</small></div>
      <div class="acoes"><button class="btn peq sec" data-act="editar-venda" data-id="${v.id}">Editar</button>
        ${EU.admin ? `<button class="btn peq sec perigo" data-act="excluir-venda" data-id="${v.id}" data-rec="${v.recebido_cent}">Excluir</button>` : ''}</div></div>`).join('');
    el.innerHTML = `<div class="topo"><div><h1>Vendas</h1><p class="sub">Funil e comissões${equipe ? ' da equipe' : ''}.</p></div>${seletorEquipe()}</div>
      <div class="funil" aria-label="Funil comercial">${colunas}</div>
      <section class="card" style="margin-top:16px">
        <div class="topo" style="align-items:center;margin-bottom:6px"><h2 style="margin:0">Vendas fechadas</h2>
          <button class="btn peq" data-act="nova-venda">+ Nova venda</button></div>
        ${linhas || vazio('Nenhuma venda ainda. Use “Nova venda” para cadastrar uma manualmente.')}
      </section>
      <section class="card" style="margin-top:16px"><h2>Comissões</h2>${totaisCom(c.totais)}
        ${c.comissoes.slice(0, 20).map(x => `<div class="linha"><div>Venda #${x.venda_id}<small>${x.pct}% · previsto ${reais(x.previsto_cent)} · liberado ${reais(x.liberado_cent)}</small></div>${chipCom(x.status)}</div>`).join('')}
      </section>`;
  },

  async operacao(el) {
    el.innerHTML = `<h1>Operação</h1><p class="sub">Clientes conquistados, contratos, pagamentos e entregas.</p>
      <section class="card">${vazio('Esta página será ligada quando o backend tiver as rotas de clientes e projetos.')}</section>`;
  },

  async financeiro(el) {
    const [c, cfg] = await Promise.all([api('GET', '/api/comissoes?equipe=1'), api('GET', '/api/admin/config')]);
    const k = cfg.config;
    el.innerHTML = `<h1>Financeiro</h1><p class="sub">Comissões da equipe e regras de percentual.</p>
      <div class="grid dois">
      <section class="card"><h2>Percentual padrão</h2>
        <p class="vazio" style="margin-top:-6px">Vale para quem não tem percentual próprio. Vendas antigas não mudam.</p>
        <div class="form">
          <div><label for="p-setup">Setup (%)</label><input id="p-setup" inputmode="decimal" value="${k.comissao_setup_pct}"></div>
          <div><label for="p-mensal">Mensalidade (%)</label><input id="p-mensal" inputmode="decimal" value="${k.comissao_mensal_pct}"></div></div>
        <p style="margin:14px 0 0"><button class="btn" data-act="salvar-cfg">Salvar percentuais</button></p></section>
      <section class="card"><h2>Comissões da equipe</h2>${totaisCom(c.totais)}</section></div>
      <section class="card" style="margin-top:14px"><h2>Repasses</h2>
        ${c.comissoes.map(x => `<div class="linha"><div>Venda #${x.venda_id} · vendedor #${x.vendedor_id}<small>${x.pct}% · liberado ${reais(x.liberado_cent)} · pago ${reais(x.pago_cent)}</small></div>
          <div>${chipCom(x.status)} ${x.a_pagar_cent > 0 ? `<button class="btn peq" data-act="pagar" data-id="${x.id}">Pagar ${reais(x.a_pagar_cent)}</button>` : ''}</div></div>`).join('') || vazio('Nenhuma comissão ainda.')}
      </section>`;
  },

  async perfil(el) {
    const me = (await api('GET', '/api/me')).usuario;
    const us = EU.admin ? (await api('GET', '/api/admin/usuarios')).usuarios : [];
    el.innerHTML = `<h1>${EU.admin ? 'Gestão' : 'Perfil'}</h1><p class="sub">${esc(me.nome)} · ${esc(me.email)}</p>
      <div id="banner"></div>
      <div class="grid dois">
      <section class="card"><h2>Minhas chaves de API</h2>
        <p class="vazio" style="margin-top:-6px">Guardadas cifradas. Deixe em branco para manter a atual.</p>
        <label for="k-groq">Groq ${me.groq ? '(' + esc(me.groq) + ')' : ''}</label><input id="k-groq" type="password" autocomplete="off">
        <label for="k-serper">Serper ${me.serper ? '(' + esc(me.serper) + ')' : ''}</label><input id="k-serper" type="password" autocomplete="off">
        <p style="margin:14px 0 0"><button class="btn" data-act="salvar-chaves">Salvar chaves</button></p></section>
      <section class="card"><h2>Conta</h2>
        <p><a class="btn sec" href="/conta/senha">Trocar senha</a></p>
        <form method="post" action="/sair"><input type="hidden" name="csrf" value="${esc(CSRF)}"><button class="btn sec">Sair</button></form></section></div>
      ${EU.admin ? `<section class="card" style="margin-top:14px"><h2>Equipe</h2>
        <div class="form">
          <div><label for="n-nome">Nome</label><input id="n-nome"></div>
          <div><label for="n-email">E-mail</label><input id="n-email" type="email"></div>
          <div><label for="n-papel">Papel</label><select id="n-papel"><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select></div>
          <div><label for="n-setup">Setup % (vazio = padrão)</label><input id="n-setup" inputmode="decimal"></div>
          <div><label for="n-mensal">Mensalidade % (vazio = padrão)</label><input id="n-mensal" inputmode="decimal"></div></div>
        <p style="margin:14px 0 6px"><button class="btn" data-act="criar-user">Criar acesso</button></p>
        ${us.map(u => `<details data-uid="${u.id}"><summary><span>${esc(u.nome)}<small style="display:block;color:var(--mudo)">${esc(u.email)} · ${u.papel}</small></span>
            <span class="chip ${u.status==='ativo'?'ok':'er'}">${u.status}</span></summary>
          <div class="form">
            <div><label>Setup %</label><input data-f="comissao_setup_pct" inputmode="decimal" value="${u.comissao_setup_pct ?? ''}" placeholder="padrão"></div>
            <div><label>Mensalidade %</label><input data-f="comissao_mensal_pct" inputmode="decimal" value="${u.comissao_mensal_pct ?? ''}" placeholder="padrão"></div>
            <div><label>Groq ${u.groq ? '(' + esc(u.groq) + ')' : ''}</label><input data-f="groq" type="password" autocomplete="off"></div>
            <div><label>Serper ${u.serper ? '(' + esc(u.serper) + ')' : ''}</label><input data-f="serper" type="password" autocomplete="off"></div></div>
          <p style="margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn peq" data-act="salvar-user">Salvar</button>
            <button class="btn peq sec" data-act="reset-senha">Gerar senha provisória</button>
            ${u.id !== EU.id ? `<button class="btn peq sec" data-act="alternar" data-st="${u.status==='ativo'?'bloqueado':'ativo'}">${u.status==='ativo'?'Desativar acesso':'Reativar acesso'}</button>` : ''}</p></details>`).join('')}
      </section>` : ''}`;
  }
};

/* ---------- ações ---------- */
/* ---------- venda: cadastrar / editar ---------- */
async function abrirVenda(venda) {
  const ed = !!venda;
  const [cl, sv, us] = await Promise.all([
    ed ? null : api('GET', '/api/clientes' + (EU.admin ? '?equipe=1' : '')),
    api('GET', '/api/servicos'),
    EU.admin && !ed ? api('GET', '/api/admin/usuarios') : null]);
  const v = venda || {};
  const cliente = ed
    ? `<div class="full"><label>Cliente</label><input value="${esc(v.cliente)}" disabled></div>`
    : `<div class="full"><label for="v-cli">Cliente</label><select id="v-cli"><option value="">+ Novo cliente</option>${cl.clientes.map(x => `<option value="${x.id}">${esc(x.empresa)}</option>`).join('')}</select></div>
       <div class="novo"><label for="v-emp">Empresa *</label><input id="v-emp" maxlength="160"></div>
       <div class="novo"><label for="v-con">Contato</label><input id="v-con" maxlength="120"></div>
       <div class="novo"><label for="v-tel">Telefone</label><input id="v-tel" maxlength="40" inputmode="tel"></div>
       <div class="novo"><label for="v-mail">E-mail</label><input id="v-mail" type="email" maxlength="254"></div>`;
  const vendedor = EU.admin && !ed
    ? `<div class="full"><label for="v-vend">Vendedor</label><select id="v-vend">${us.usuarios.filter(u => u.status === 'ativo').map(u => `<option value="${u.id}" ${u.id === EU.id ? 'selected' : ''}>${esc(u.nome)}</option>`).join('')}</select></div>` : '';
  const pcts = EU.admin
    ? `<div><label for="v-ps">Comissão setup (%)</label><input id="v-ps" inputmode="decimal" placeholder="padrão" value="${ed ? v.pct_setup : ''}"></div>
       <div><label for="v-pm">Comissão mensal (%)</label><input id="v-pm" inputmode="decimal" placeholder="padrão" value="${ed ? v.pct_mensal : ''}"></div>` : '';
  const dlg = $('#dlg-venda');
  dlg.dataset.id = ed ? v.id : '';
  dlg.innerHTML = `<div class="dlg"><h2 id="dlg-tit">${ed ? 'Editar venda' : 'Nova venda'}</h2>
    <p class="vazio" style="margin:0">${ed ? 'Parcelas que já receberam pagamento não podem ficar abaixo do valor recebido.' : 'Cadastro manual de uma venda já fechada.'}</p>
    <div class="form">${cliente}${vendedor}
      <div class="full"><label for="v-srv">Serviço</label><select id="v-srv"><option value="">— sem serviço —</option>${sv.servicos.map(x => `<option value="${x.id}" ${x.id === v.servico_id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>
      <div><label for="v-setup">Setup (R$)</label><input id="v-setup" inputmode="decimal" placeholder="0,00" value="${emReais(v.setup_cent)}"></div>
      <div><label for="v-svence">Vencimento do setup</label><input id="v-svence" type="date" value="${v.setup_vence || ''}"></div>
      <div><label for="v-mensal">Mensalidade (R$)</label><input id="v-mensal" inputmode="decimal" placeholder="0,00" value="${emReais(v.mensal_cent)}"></div>
      <div><label for="v-minicio">1ª mensalidade em</label><input id="v-minicio" type="date" value="${v.mensal_inicio || ''}"></div>
      <div><label for="v-data">Data da venda</label><input id="v-data" type="date" value="${v.fechada_em || ''}"></div>
      ${pcts}</div>
    <div id="v-erro" class="aviso" role="alert" hidden></div>
    <div class="rod"><button class="btn sec" data-act="fechar-dlg">Cancelar</button><button class="btn" data-act="salvar-venda">${ed ? 'Salvar alterações' : 'Cadastrar venda'}</button></div></div>`;
  const sel = $('#v-cli', dlg);
  if (sel) {
    const alterna = () => dlg.querySelectorAll('.novo').forEach(n => n.hidden = !!sel.value);
    sel.addEventListener('change', alterna); alterna();
  }
  dlg.showModal();
}

const ACOES = {
  'nova-venda': () => abrirVenda(null),
  'editar-venda': b => abrirVenda(VENDAS.find(x => x.id === Number(b.dataset.id))),
  'fechar-dlg': () => $('#dlg-venda').close(),
  async 'salvar-venda'() {
    const dlg = $('#dlg-venda'), id = dlg.dataset.id, erro = $('#v-erro', dlg);
    erro.hidden = true;
    try {
      const d = {servico_id: $('#v-srv').value ? Number($('#v-srv').value) : null,
        setup_cent: cent($('#v-setup').value), mensal_cent: cent($('#v-mensal').value),
        setup_vence: $('#v-svence').value || null, mensal_inicio: $('#v-minicio').value || null,
        fechada_em: $('#v-data').value || null};
      if (d.setup_cent + d.mensal_cent <= 0) throw new Error('Informe o valor do setup e/ou da mensalidade.');
      if (EU.admin) { d.pct_setup = num($('#v-ps').value); d.pct_mensal = num($('#v-pm').value); }
      if (id) await api('PUT', '/api/vendas/' + id, d);
      else {
        const cli = $('#v-cli').value;
        if (cli) d.cliente_id = Number(cli);
        else {
          if (!$('#v-emp').value.trim()) throw new Error('Informe o nome da empresa do cliente.');
          d.cliente_novo = {empresa: $('#v-emp').value, contato: $('#v-con').value, telefone: $('#v-tel').value, email: $('#v-mail').value};
        }
        if (EU.admin) d.vendedor_id = Number($('#v-vend').value);
        await api('POST', '/api/vendas', d);
      }
    } catch (err) { erro.textContent = err.message; erro.hidden = false; return; }
    dlg.close(); aviso(id ? 'Venda atualizada.' : 'Venda cadastrada.'); return rota();
  },
  async 'excluir-venda'(b) {
    const rec = Number(b.dataset.rec) || 0;
    const msg = rec > 0
      ? `Esta venda já tem ${reais(rec)} recebido. Excluir apaga a venda, os pagamentos e as comissões dela. Continuar?`
      : 'Excluir esta venda, com pagamentos e comissões?';
    if (!confirm(msg)) return;
    await api('DELETE', '/api/admin/vendas/' + b.dataset.id, {forcar: true});
    aviso('Venda excluída.'); return rota();
  },
  escopo: b => { equipe = b.dataset.v === '1'; return rota(); },
  async 'salvar-cfg'() {
    await api('PUT', '/api/admin/config', {comissao_setup_pct: num($('#p-setup').value), comissao_mensal_pct: num($('#p-mensal').value)});
    aviso('Percentuais salvos.');
  },
  async pagar(b) { const r = await api('POST', `/api/admin/comissoes/${b.dataset.id}/pagar`, {}); aviso('Pago ' + reais(r.pago_agora_cent) + '.'); return rota(); },
  async 'salvar-chaves'() {
    const d = {};
    if ($('#k-groq').value.trim()) d.groq = $('#k-groq').value.trim();
    if ($('#k-serper').value.trim()) d.serper = $('#k-serper').value.trim();
    if (!Object.keys(d).length) return aviso('Digite uma chave para salvar.');
    await api('PUT', '/api/me/chaves', d); aviso('Chaves salvas.'); return rota();
  },
  async 'criar-user'() {
    const r = await api('POST', '/api/admin/usuarios', {nome: $('#n-nome').value, email: $('#n-email').value, papel: $('#n-papel').value,
      comissao_setup_pct: num($('#n-setup').value), comissao_mensal_pct: num($('#n-mensal').value)});
    await rota(); mostrarSenha(r.usuario.email, r.senha_temporaria);
  },
  async 'salvar-user'(b) {
    const box = b.closest('details'), d = {};
    box.querySelectorAll('[data-f]').forEach(i => {
      const f = i.dataset.f;
      if (f.startsWith('comissao')) d[f] = num(i.value);
      else if (i.value.trim()) d[f] = i.value.trim();
    });
    await api('PUT', '/api/admin/usuarios/' + box.dataset.uid, d); aviso('Usuário salvo.'); return rota();
  },
  async 'reset-senha'(b) {
    const id = b.closest('details').dataset.uid;
    const r = await api('PUT', '/api/admin/usuarios/' + id, {resetar_senha: true});
    await rota(); mostrarSenha(r.usuario.email, r.senha_temporaria);
  },
  async alternar(b) { await api('PUT', '/api/admin/usuarios/' + b.closest('details').dataset.uid, {status: b.dataset.st}); aviso('Acesso atualizado.'); return rota(); }
};

function mostrarSenha(email, senha) {
  const el = $('#banner'); if (!el) return;
  el.innerHTML = `<div class="aviso"><strong>Senha provisória de ${esc(email)}:</strong> <code>${esc(senha)}</code><br>
    Ela aparece só agora. A pessoa troca no primeiro acesso.</div>`;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || !ACOES[b.dataset.act]) return;
  b.disabled = true;
  try { await ACOES[b.dataset.act](b); } catch (err) { aviso(err.message); }
  b.disabled = false;
});

/* ---------- rota ---------- */
function desenharMenu() {
  const atual = (location.hash || '#inicio').slice(1);
  $('#menu').innerHTML = PAGINAS.map(([id, nome]) =>
    `<a href="#${id}" class="${id === atual ? 'on' : ''}" ${id === atual ? 'aria-current="page"' : ''}><svg><use href="#i-${id}"/></svg>${nome}</a>`).join('');
}
async function rota() {
  let id = (location.hash || '#inicio').slice(1);
  if (!VIEWS[id] || !PAGINAS.some(p => p[0] === id)) id = 'inicio';
  desenharMenu();
  const el = $('#view');
  try { await VIEWS[id](el); }
  catch (err) { el.innerHTML = `<section class="card"><h2>Não foi possível carregar</h2><p class="vazio">${esc(err.message)}</p><button class="btn" data-act="escopo" data-v="${equipe?1:0}">Tentar de novo</button></section>`; }
}
/* menu hambúrguer (celular) */
const burger = $('#burger'), menuEl = $('#menu');
const ICO_MENU = '<path d="M4 7h16M4 12h16M4 17h16"/>', ICO_X = '<path d="M6 6l12 12M18 6L6 18"/>';
function menuAberto(a) {
  menuEl.classList.toggle('aberto', a);
  burger.setAttribute('aria-expanded', a); burger.setAttribute('aria-label', a ? 'Fechar menu' : 'Abrir menu');
  burger.firstElementChild.innerHTML = a ? ICO_X : ICO_MENU;
}
burger.addEventListener('click', () => menuAberto(!menuEl.classList.contains('aberto')));
menuEl.addEventListener('click', e => { if (e.target.closest('a')) menuAberto(false); });
addEventListener('keydown', e => { if (e.key === 'Escape') menuAberto(false); });
addEventListener('hashchange', () => { rota(); window.scrollTo(0, 0); });
rota();
</script>
</body>
</html>
